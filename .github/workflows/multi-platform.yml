name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # the texture pack and its companion mod have their own build
    paths-ignore:
      - 'minimal/**'
      - 'solidtrail/**'
      - '.github/workflows/solidtrail.yml'
      - 'texturepack/**'
      - '.github/workflows/minimal.yml'

# A newer push to the same branch replaces the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        # Windows only: it's the only platform this mod is used on, and the
        # macOS runners cost 10x the build minutes.
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: write # the compile errors release below

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # Locked to a known-good bindings commit for GD 2.2081. Newer commits
          # on bindings main are mostly for 2.2091 and broke the build.
          bindings-ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80
          # Build the code generator from those bindings instead of downloading
          # the newest prebuilt one, which expects a newer Geode SDK than 5.11.2.
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      # When the build breaks, compile again with the output saved and publish
      # it as the "debug-log-win" release (Actions logs can't always be read).
      - name: Publish the compile errors
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $dir = Get-ChildItem -Directory -Filter "build*" | Select-Object -First 1
          "build dir: $dir" | Out-File build-errors.log
          cmake --build $dir --config RelWithDebInfo --parallel 1 2>&1 | Out-File -Append build-errors.log
          cmake --build $dir --config Release --parallel 1 2>&1 | Out-File -Append build-errors.log
          gh release delete debug-log-win --yes --cleanup-tag 2>$null
          gh release create debug-log-win build-errors.log --title "Windows build errors" --notes "Compile output of the last failed build" --prerelease

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Build Output
          path: out

      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.geode \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Predictive Input Buffer - latest build" \
            --notes "Built from ${{ github.sha }}. Drop the .geode into Geometry Dash/geode/mods."
