name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - pb2

# A newer push to the same branch replaces the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        # Windows only: it's the only platform this mod is used on, and the
        # macOS runners cost 10x the build minutes.
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # Locked to a known-good bindings commit for GD 2.2081. Newer commits
          # on bindings main are mostly for 2.2091 and broke the build.
          bindings-ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80
          # Build the code generator from those bindings instead of downloading
          # the newest prebuilt one, which expects a newer Geode SDK than 5.11.2.
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/pb2'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Build Output
          path: out

      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete pb2-latest --yes --cleanup-tag || true
          gh release create pb2-latest out/*.geode \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "PB 2.0 - latest build" \
            --notes "Built from ${{ github.sha }}. Drop the .geode into Geometry Dash/geode/mods."
