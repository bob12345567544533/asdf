name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # Locked to a known-good bindings commit for GD 2.2081. Newer commits
          # on bindings main are mostly for 2.2091 and broke the build.
          bindings-ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/lite'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Build Output
          path: out

      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete lite-latest --yes --cleanup-tag || true
          gh release create lite-latest out/*.geode \
            --target "${{ github.sha }}" \
            --title "Lite - latest build" \
            --notes "Built from ${{ github.sha }}. Drop the .geode into Geometry Dash/geode/mods."
