name: Build Made for Julia

# Julia's background mod (in julia/). Separate from the
# Predictive Input Buffer build so the two never affect each other.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'julia/**'
      - '.github/workflows/julia.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write # the compile errors release below
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: julia
          combine: true
          # Same known-good setup as the Predictive Input Buffer build (GD 2.2081, Geode 5.11.2).
          bindings-ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      # When the build breaks, compile again with the output saved and publish
      # it as the "debug-log-julia" release (Actions logs can't always be read).
      - name: Publish the compile errors
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $dir = Get-ChildItem -Path julia -Directory -Filter "build*" | Select-Object -First 1
          "build dir: $($dir.FullName)" | Out-File build-errors.log
          cmake --build $dir.FullName --config RelWithDebInfo --parallel 1 2>&1 | Out-File -Append build-errors.log
          cmake --build $dir.FullName --config Release --parallel 1 2>&1 | Out-File -Append build-errors.log
          gh release delete debug-log-julia --yes --cleanup-tag 2>$null
          gh release create debug-log-julia build-errors.log --title "Made for Julia build errors" --notes "Compile output of the last failed build" --prerelease

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Made for Julia
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Made for Julia
          path: out

      - name: Update the "julia-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete julia-latest --yes --cleanup-tag || true
          gh release create julia-latest out/*.geode \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Made for Julia - latest build" \
            --notes "Built from ${{ github.sha }}. Drop the .geode into Geometry Dash/geode/mods."
