name: Build Minimal Helper

# The Minimal texture pack's companion mod (in minimal/). Separate from the
# Predictive Input Buffer build so the two never affect each other.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'minimal/**'
      - '.github/workflows/minimal.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: minimal
          combine: true
          # Same known-good setup as the Predictive Input Buffer build (GD 2.2081, Geode 5.11.2).
          bindings-ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Minimal Helper
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Minimal Helper
          path: out

      - name: Update the "minimal-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete minimal-latest --yes --cleanup-tag || true
          gh release create minimal-latest out/*.geode \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Minimal Helper - latest build" \
            --notes "Built from ${{ github.sha }}. Drop the .geode into Geometry Dash/geode/mods."
