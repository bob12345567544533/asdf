name: Debug build log

# Runs the Android64 build step by step and publishes the full output as the
# "debug-log" release, so the log can be read without access to Actions logs.

on:
  workflow_dispatch:
  push:
    branches:
      - lite

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download bindings repo
        uses: actions/checkout@v7
        with:
          repository: geode-sdk/bindings
          ref: d3a81aa011a4c2cc4a406d30321cd68d21ca9a80
          path: bindings-repo

      - name: Setup CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Build with full log
        shell: bash
        run: |
          {
            set -x
            uname -a; cat /etc/os-release | head -3
            ls /usr/local/lib/android/sdk/ndk/ || true
            geode --version
            curl -sL https://github.com/ninja-build/ninja/releases/latest/download/ninja-linux.zip -o ninja.zip
            7z x ninja.zip -o"$GITHUB_WORKSPACE/ninja" > /dev/null
            export PATH="$GITHUB_WORKSPACE/ninja:$PATH"
            export GEODE_BINDINGS_REPO_PATH="$GITHUB_WORKSPACE/bindings-repo"
            export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
            mkdir -p "$CLI_PROFILE/geode/mods"
            geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win
            geode sdk install "$GITHUB_WORKSPACE/geode-sdk-clone"
            export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk-clone"
            geode sdk update 5.11.2
            geode sdk install-binaries --platform android64 --version 5.11.2
            NDK_PATH=/usr/local/lib/android/sdk/ndk/29.0.14206865
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
            && cmake --build build --config Release --parallel
            echo "EXIT CODE: $?"
          } > build.log 2>&1 || true
          tail -c 200000 build.log > build-tail.log

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete debug-log --yes --cleanup-tag || true
          gh release create debug-log build-tail.log --title "Debug log" --notes "Build log for debugging" --prerelease
